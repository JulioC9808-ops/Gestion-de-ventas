name: Android Releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # ============================================================
      # CONFIGURAR CACHE ELECTRON
      # ============================================================

      - name: Configure Electron cache
        run: |
          export ELECTRON_CACHE=$HOME/.cache/electron
          export ELECTRON_SKIP_BINARY_DOWNLOAD=0

      # ============================================================
      # INSTALAR DEPENDENCIAS
      # ============================================================

      - name: Install dependencies
        run: |
          npm ci --registry=https://registry.npmjs.org/ --legacy-peer-deps || \
          npm install --no-audit --registry=https://registry.npmjs.org/ --legacy-peer-deps

      # ============================================================
      # BUILD WEB
      # ============================================================

      - name: Build web assets
        run: npm run build
        env:
          VITE_ELTOQUE_API_KEY: ${{ secrets.VITE_ELTOQUE_API_KEY }}

      # ============================================================
      # CAPACITOR
      # ============================================================

      - name: Sync Capacitor
        run: npx --no-install cap sync android

      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools

      # ============================================================
      # LICENCIAS ANDROID
      # ============================================================

      - name: Accept ALL Android SDK licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      # ============================================================
      # PAQUETES ANDROID
      # ============================================================

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Remove old Lovable package
        run: rm -rf android/app/src/main/java/app

      - name: Clean Gradle
        working-directory: android
        run: ./gradlew clean

      # ============================================================
      # BUILD APK + AAB
      # ============================================================

      - name: Build Android APK and AAB Bundle
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
          ./gradlew bundleRelease --no-daemon --stacktrace

      # ============================================================
      # KEYSTORE
      # ============================================================

      - name: Decode Keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-release-key.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # ============================================================
      # ZIPALIGN
      # ============================================================

      - name: Zipalign APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/zipalign \
            -p -f 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk

      # ============================================================
      # FIRMAR APK
      # ============================================================

      - name: Sign APK with apksigner
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks my-release-key.keystore \
            --ks-key-alias gestionventas \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out android/app/build/outputs/apk/release/app-release-signed.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk

      # ============================================================
      # FIRMAR AAB
      # ============================================================

      - name: Sign AAB for Google Play
        run: |
          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            android/app/build/outputs/bundle/release/app-release-signed.aab

          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore my-release-key.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            android/app/build/outputs/bundle/release/app-release-signed.aab \
            gestionventas

      # ============================================================
      # VERIFICAR FIRMA
      # ============================================================

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify \
            --verbose \
            android/app/build/outputs/apk/release/app-release-signed.apk

      # ============================================================
      # SHA-256
      # ============================================================

      - name: Calculate SHA-256 hash for in-app updates
        run: |
          APK_HASH=$(sha256sum \
            android/app/build/outputs/apk/release/app-release-signed.apk \
            | awk '{print $1}')

          echo "APK SHA-256 HASH: $APK_HASH"
          echo "apk_sha256=$APK_HASH" >> "$GITHUB_ENV"

      # ============================================================
      # LEER VERSION ANDROID
      # ============================================================

      - name: Read app version
        id: app_version
        run: |
          VERSION_NAME=$(grep -m1 versionName android/app/build.gradle \
            | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' \
            | head -1)

          VERSION_CODE=$(grep -m1 versionCode android/app/build.gradle \
            | grep -oE '[0-9]+' \
            | head -1)

          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="desconocida"
          fi

          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE="0"
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

          echo "Version detectada: $VERSION_NAME (code $VERSION_CODE)"

      # ============================================================
      # DEFINIR TAG ANDROID
      # ============================================================

      - name: Configure Android release tag
        id: android_release
        shell: bash
        run: |
          VERSION="${{ steps.app_version.outputs.version_name }}"

          ANDROID_TAG="android-v${VERSION}"

          echo "android_tag=$ANDROID_TAG" >> "$GITHUB_OUTPUT"

          echo "=============================================="
          echo "VERSION ANDROID"
          echo "=============================================="
          echo "Version: $VERSION"
          echo "Tag historico: $ANDROID_TAG"

      # ============================================================
      # SUBIR ARTIFACT APK
      # ============================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestionDeSistema-release-apk
          path: android/app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error
          retention-days: 3

      # ============================================================
      # SUBIR ARTIFACT AAB
      # ============================================================

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestionDeSistema-release-aab-playstore
          path: android/app/build/outputs/bundle/release/app-release-signed.aab
          if-no-files-found: error
          retention-days: 3

      # ============================================================
      # CREAR RELEASE HISTORICA ANDROID
      #
      # Ejemplo:
      # android-v1.3
      # android-v1.4
      # android-v1.5
      #
      # GitHub genera automaticamente las Release Notes.
      # ============================================================

      - name: Create Android historical release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.UPDATES_TOKEN }}
          ANDROID_TAG: ${{ steps.android_release.outputs.android_tag }}
          VERSION: ${{ steps.app_version.outputs.version_name }}
        run: |
          echo "=============================================="
          echo "RELEASE HISTORICA ANDROID"
          echo "=============================================="

          if gh release view "$ANDROID_TAG" \
            -R JulioC9808-ops/Sistema-Updates \
            > /dev/null 2>&1
          then

            echo "La Release $ANDROID_TAG ya existe."

          else

            echo "Creando
