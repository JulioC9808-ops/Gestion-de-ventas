name: Release Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean install
        shell: cmd
        run: |
          if exist node_modules rd /s /q node_modules
          if exist package-lock.json del /f /q package-lock.json
          npm install --include=optional --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Fix native dependencies (Rollup + SWC)
        shell: cmd
        run: |
          npm install @rollup/rollup-win32-x64-msvc --save-dev --include=optional
          npm install @swc/core-win32-x64-msvc --save-dev --include=optional

      - name: Verify native bindings
        shell: cmd
        run: |
          node -e "require('@rollup/rollup-win32-x64-msvc'); console.log('Rollup binding OK');"
          node -e "require('@swc/core-win32-x64-msvc'); console.log('SWC binding OK');"
          node -e "const swc = require('@swc/core'); console.log('SWC core loads OK, version:', swc.version);"

      - name: Prepare NSIS license encoding
        shell: powershell
        run: |
          $path = "resources/license.txt"
          $content = [System.IO.File]::ReadAllText($path, [System.Text.Encoding]::UTF8)
          [System.IO.File]::WriteAllText($path, $content, [System.Text.Encoding]::GetEncoding(1252))
          Write-Host "License converted to Windows-1252 successfully."

      - name: Build app
        shell: cmd
        run: npm run build

      - name: Package Electron app (PROTEGIDO)
        shell: cmd
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run electron:installer

      - name: Normalize filenames (remove spaces)
        shell: bash
        run: |
          echo "=== Contenido ANTES de normalizar ==="
          ls -la dist-installer/ || echo "No existe dist-installer"
          find dist-installer -maxdepth 1 -type f -name "* *" -print0 | while IFS= read -r -d '' f; do
            dir=$(dirname "$f")
            base=$(basename "$f")
            newbase="${base// /_}"
            echo "Renombrando: '$f' -> '$dir/$newbase'"
            mv "$f" "$dir/$newbase"
          done
          echo "=== Contenido DESPUES de normalizar ==="
          ls -la dist-installer/

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-installer/*.exe
          retention-days: 3

      - name: Get latest release tag
        id: get_release
        shell: bash
        run: |
          LATEST=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name 2>/dev/null || echo "")
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            LATEST="1.0.0"
          fi
          LATEST="${LATEST#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          NEW_PATCH=$((PATCH + 1))
          NEW_TAG="${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Nuevo tag: $NEW_TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find installer file
        id: find_exe
        shell: bash
        run: |
          EXE_PATH=$(find dist-installer -maxdepth 1 -type f -name "*.exe" -print -quit)
          if [ -z "$EXE_PATH" ]; then
            echo "No se encontro ningun .exe en dist-installer/" >&2
            ls -la dist-installer/ || true
            exit 1
          fi
          EXE_NAME=$(basename "$EXE_PATH")
          echo "exe_path=$EXE_PATH" >> "$GITHUB_OUTPUT"
          echo "exe_name=$EXE_NAME" >> "$GITHUB_OUTPUT"
          echo "Encontrado: $EXE_PATH"

      - name: Create new release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_release.outputs.new_tag }}
          name: "Gestion de Ventas v${{ steps.get_release.outputs.new_tag }} (Windows)"
          files: ${{ steps.find_exe.outputs.exe_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare latest.yml for auto-updater
        shell: bash
        run: |
          LATEST_YML=$(find dist-installer -maxdepth 1 -type f -name "latest.yml" -print -quit)
          if [ -n "$LATEST_YML" ]; then
            cp "$LATEST_YML" ./latest.yml
            echo "Usando $LATEST_YML"
          else
            EXE_FILE="${{ steps.find_exe.outputs.exe_path }}"
            EXE_NAME="${{ steps.find_exe.outputs.exe_name }}"
            SHA512_B64=$(sha512sum "$EXE_FILE" | awk '{print $1}' | xxd -r -p | base64 | tr -d '\n')
            SIZE_BYTES=$(stat -c%s "$EXE_FILE" 2>/dev/null || wc -c < "$EXE_FILE")
            {
              echo "version: ${{ steps.get_release.outputs.new_tag }}"
              echo "path: $EXE_NAME"
              echo "sha512: $SHA512_B64"
              echo "releaseDate: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
              echo "files:"
              echo "  - url: $EXE_NAME"
              echo "    sha512: $SHA512_B64"
              echo "    size: $SIZE_BYTES"
            } > latest.yml
          fi
          echo "=== latest.yml ==="
          cat latest.yml

      - name: Upload new release to public repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.UPDATES_TOKEN }}
        run: |
          TAG="${{ steps.get_release.outputs.new_tag }}"
          EXE="${{ steps.find_exe.outputs.exe_path }}"
          BLOCKMAP_FILE=$(find dist-installer -maxdepth 1 -type f -name "*.blockmap" -print -quit)
          echo "Tag: $TAG"
          echo "Exe: $EXE"
          echo "Blockmap: ${BLOCKMAP_FILE:-(ninguno)}"
          if gh release view "$TAG" -R JulioC9808-ops/Sistema-Updates > /dev/null 2>&1; then
            if [ -n "$BLOCKMAP_FILE" ]; then
              gh release upload "$TAG" "$EXE" latest.yml "$BLOCKMAP_FILE" -R JulioC9808-ops/Sistema-Updates --clobber
            else
              gh release upload "$TAG" "$EXE" latest.yml -R JulioC9808-ops/Sistema-Updates --clobber
            fi
          else
            if [ -n "$BLOCKMAP_FILE" ]; then
              gh release create "$TAG" "$EXE" latest.yml "$BLOCKMAP_FILE" -R JulioC9808-ops/Sistema-Updates -t "Version $TAG (Windows)" -n "Actualizacion automatica - v$TAG"
            else
              gh release create "$TAG" "$EXE" latest.yml -R JulioC9808-ops/Sistema-Updates -t "Version $TAG (Windows)" -n "Actualizacion automatica - v$TAG"
            fi
          fi

      - name: Notify Telegram channel
        if: success()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          TAG="${{ steps.get_release.outputs.new_tag }}"
          URL="https://github.com/JulioC9808-ops/Sistema-Updates/releases/tag/${TAG}"
          MESSAGE="Nueva version disponible. Gestion de Ventas Windows. Version v${TAG}. Descargar: ${URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=@Gestion_Ventas" -d parse_mode="HTML" -d disable_web_page_preview="false" --data-urlencode "text=${MESSAGE}"

      - name: Upload installer to Telegram
        if: success()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          TAG="${{ steps.get_release.outputs.new_tag }}"
          EXE="${{ steps.find_exe.outputs.exe_path }}"
          EXE_NAME="${{ steps.find_exe.outputs.exe_name }}"
          SIZE_MB=$(du -m "$EXE" | cut -f1)
          echo "Subiendo ${EXE_NAME} (${SIZE_MB} MB) a Telegram..."
          CAPTION="Gestion de Ventas v${TAG} - Instalador Windows ${SIZE_MB} MB"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" --form-string "chat_id=@Gestion_Ventas" -F "document=@${EXE}" --form-string "caption=${CAPTION}" --form-string "parse_mode=HTML")
          HTTP_STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          echo "HTTP Status: $HTTP_STATUS"
          echo "Respuesta:"
          echo "$BODY"
          if echo "$BODY" | grep -q '"ok":true'; then
            echo "Instalador subido a Telegram correctamente."
          else
            echo "Error al subir el instalador."
            exit 1
          fi
