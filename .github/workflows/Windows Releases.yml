name: Release Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # cache: 'npm'  # Deshabilitado intencionalmente para forzar una instalación limpia

      - name: Clean install
        shell: cmd
        run: |
          if exist node_modules rd /s /q node_modules
          if exist package-lock.json del /f /q package-lock.json
          npm install --include=optional --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Fix native dependencies (Rollup + SWC)
        shell: cmd
        run: |
          npm install @rollup/rollup-win32-x64-msvc --save-dev --include=optional
          npm install @swc/core-win32-x64-msvc --save-dev --include=optional

      - name: Verify native bindings
        shell: cmd
        run: |
          node -e "require('@rollup/rollup-win32-x64-msvc'); console.log('Rollup binding OK');"
          node -e "require('@swc/core-win32-x64-msvc'); console.log('SWC binding OK');"
          node -e "const swc = require('@swc/core'); console.log('SWC core loads OK, version:', swc.version);"

      - name: Prepare NSIS license encoding
        shell: powershell
        run: |
          $path = "resources/license.txt"
          $content = [System.IO.File]::ReadAllText($path, [System.Text.Encoding]::UTF8)
          [System.IO.File]::WriteAllText($path, $content, [System.Text.Encoding]::GetEncoding(1252))
          Write-Host "License converted to Windows-1252 successfully."

      - name: Build app
        shell: cmd
        run: npm run build

      - name: Package Electron app (PROTEGIDO)
        shell: cmd
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run electron:installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-installer/*.exe
          retention-days: 3
          
      # ---- A partir de aquí: publicar en Releases ----
      - name: Get latest release tag
        id: get_release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name 2>/dev/null || echo "1.0.0")
          IFS='.' read -r major minor patch <<< "$latest"
          new_patch=$((patch + 1))
          new_tag="${major}.${minor}.${new_patch}"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"

      - name: Find installer file
        id: find_exe
        shell: bash
        run: |
          exe_path=$(ls dist-installer/*.exe | head -n 1)
          echo "exe_path=$exe_path" >> "$GITHUB_OUTPUT"
          echo "exe_name=$(basename "$exe_path")" >> "$GITHUB_OUTPUT"

      - name: Create new private release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_release.outputs.new_tag }}
          name: "Gestion de Ventas v${{ steps.get_release.outputs.new_tag }} (Windows)"
          files: ${{ steps.find_exe.outputs.exe_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare latest.yml for auto-updater
        shell: bash
        run: |
          if [ -f "dist-installer/latest.yml" ]; then
            cp "dist-installer/latest.yml" ./latest.yml
            echo "Using electron-builder generated dist-installer/latest.yml"
          else
            exe_file="${{ steps.find_exe.outputs.exe_path }}"
            exe_name="${{ steps.find_exe.outputs.exe_name }}"
            sha512_b64=$(sha512sum "$exe_file" | awk '{print $1}' | xxd -r -p | base64)
            size_bytes=$(stat -c%s "$exe_file" 2>/dev/null || wc -c < "$exe_file")
            {
              echo "version: ${{ steps.get_release.outputs.new_tag }}"
              echo "path: $exe_name"
              echo "sha512: $sha512_b64"
              echo "releaseDate: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
              echo "files:"
              echo "  - url: $exe_name"
              echo "    sha512: $sha512_b64"
              echo "    size: $size_bytes"
            } > latest.yml
          fi
          cat latest.yml

      - name: Upload new release to public repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.UPDATES_TOKEN }}
        run: |
          TAG="${{ steps.get_release.outputs.new_tag }}"
          EXE="${{ steps.find_exe.outputs.exe_path }}"
          BLOCKMAP_FILE=$(ls dist-installer/*.blockmap 2>/dev/null | head -n 1 || echo "")
          EXTRA_ARGS=""
          if [ -n "$BLOCKMAP_FILE" ] && [ -f "$BLOCKMAP_FILE" ]; then
            EXTRA_ARGS="$BLOCKMAP_FILE"
          fi
          if gh release view "$TAG" -R JulioC9808-ops/Sistema-Updates > /dev/null 2>&1; then
            gh release upload "$TAG" "$EXE" latest.yml $EXTRA_ARGS -R JulioC9808-ops/Sistema-Updates --clobber
          else
            gh release create "$TAG" "$EXE" latest.yml $EXTRA_ARGS \
              -R JulioC9808-ops/Sistema-Updates \
              -t "Version $TAG (Windows)" \
              -n "Actualización automática de Windows - Gestión de Ventas v$TAG"
          fi

      # ---- Notificar a Telegram (mensaje con enlaces directos) ----
      - name: Notify Telegram channel
        if: success()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          TAG="${{ steps.get_release.outputs.new_tag }}"
          EXE_NAME="${{ steps.find_exe.outputs.exe_name }}"
          URL="https://github.com/JulioC9808-ops/Sistema-Updates/releases/tag/${TAG}"
          DIRECT_DOWNLOAD="https://github.com/JulioC9808-ops/Sistema-Updates/releases/download/${TAG}/${EXE_NAME}"

          MESSAGE="🚀 <b>Nueva versión disponible</b>

📦 <b>Gestión de Ventas</b> — Windows
🏷️ Versión: <code>v${TAG}</code>

⬇️ <a href=\"${URL}\">Ver lanzamiento en GitHub</a>
📥 <a href=\"${DIRECT_DOWNLOAD}\">Descargar Instalador (${EXE_NAME})</a>

<i>El instalador también se adjunta a continuación.</i>"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="@Gestion_Ventas" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="false" \
            --data-urlencode "text=${MESSAGE}"

      # ---- Subir el .exe a Telegram ----
      - name: Upload installer to Telegram
        if: success()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          TAG="${{ steps.get_release.outputs.new_tag }}"
          EXE="${{ steps.find_exe.outputs.exe_path }}"
          EXE_NAME="${{ steps.find_exe.outputs.exe_name }}"
          SIZE_MB=$(du -m "$EXE" | cut -f1)

          echo "Subiendo ${EXE_NAME} (${SIZE_MB} MB) a Telegram..."

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="@Gestion_Ventas" \
            -F document=@"${EXE}" \
            -F caption="💾 <b>Gestión de Ventas v${TAG}</b> — Instalador Windows (${EXE_NAME})" \
            -F parse_mode="HTML")

          echo "$RESPONSE"

          # Verificar que Telegram aceptó el archivo
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "✅ Instalador subido a Telegram correctamente."
          else
            echo "⚠️ Aviso: Telegram no aceptó el archivo adjunto (revisa si supera 50MB o permisos del bot)."
          fi
