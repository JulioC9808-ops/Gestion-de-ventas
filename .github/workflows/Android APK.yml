name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Clean install
        shell: cmd
        run: |
          if exist node_modules rd /s /q node_modules
          if exist package-lock.json del package-lock.json
          npm install --force

      - name: Fix Rollup native dependency
        run: npm install @rollup/rollup-win32-x64-msvc --save-dev

      - name: Prepare NSIS license encoding
        shell: powershell
        run: |
          $path = "resources/license.txt"

          $content = [System.IO.File]::ReadAllText(
            $path,
            [System.Text.Encoding]::UTF8
          )

          [System.IO.File]::WriteAllText(
            $path,
            $content,
            [System.Text.Encoding]::GetEncoding(1252)
          )

          Write-Host "License converted to Windows-1252 successfully."

      - name: Build app
        shell: cmd
        run: npm run build

      - name: Package and publish Electron app
        shell: cmd
        env:
          GH_TOKEN: ${{ secrets.UPDATES_TOKEN }}
        run: npx electron-builder --publish always

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-installer/*.exe
          retention-days: 3

      # ---- Copia de respaldo en el repo privado (opcional, solo registro interno) ----

      - name: Get latest release tag
        id: get_release
        shell: bash
        run: |
          latest=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name 2>/dev/null || echo "1.0.0")
          IFS='.' read -r major minor patch <<< "$latest"
          new_patch=$((patch + 1))
          new_tag="${major}.${minor}.${new_patch}"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find installer file
        id: find_exe
        shell: bash
        run: |
          exe_path=$(ls dist-installer/*.exe | head -n 1)
          echo "exe_path=$exe_path" >> "$GITHUB_OUTPUT"

      - name: Create private release copy
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_release.outputs.new_tag }}
          name: "Gestion de Ventas v${{ steps.get_release.outputs.new_tag }} (Windows)"
          files: ${{ steps.find_exe.outputs.exe_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
