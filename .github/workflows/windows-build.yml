name: Build Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean install
        shell: cmd
        run: npm install --include=optional --no-audit --registry=https://registry.npmjs.org/

      - name: Fix native dependencies (Rollup + SWC)
        shell: cmd
        run: |
          npm install @rollup/rollup-win32-x64-msvc --save-dev
          npm install @swc/core-win32-x64-msvc --save-dev

      - name: Verify SWC binding
        shell: cmd
        run: node -e "console.log(require.resolve('@swc/core-win32-x64-msvc'))"

      - name: Prepare NSIS license encoding
        shell: powershell
        run: |
          $path = "resources/license.txt"
          $content = [System.IO.File]::ReadAllText($path, [System.Text.Encoding]::UTF8)
          [System.IO.File]::WriteAllText($path, $content, [System.Text.Encoding]::GetEncoding(1252))
          Write-Host "License converted to Windows-1252 successfully."

      - name: Build app
        shell: cmd
        run: npm run build

      - name: Package Electron app (PROTEGIDO)
        shell: cmd
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run electron:installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-installer/*.exe
          retention-days: 3
