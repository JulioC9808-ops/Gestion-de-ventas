name: Build and Release Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Clean install
        shell: cmd
        run: |
          if exist node_modules rd /s /q node_modules
          if exist package-lock.json del package-lock.json
          npm install --force

      - name: Fix Rollup native dependency
        run: npm install @rollup/rollup-win32-x64-msvc --save-dev

      - name: Prepare NSIS license encoding
        shell: powershell
        run: |
          $path = "resources/license.txt"

          $content = [System.IO.File]::ReadAllText(
            $path,
            [System.Text.Encoding]::UTF8
          )

          [System.IO.File]::WriteAllText(
            $path,
            $content,
            [System.Text.Encoding]::GetEncoding(1252)
          )

          Write-Host "License converted to Windows-1252 successfully."

      - name: Build app
        run: npm run build

      - name: Package Electron app
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run electron:build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-installer/*.exe
          retention-days: 3
