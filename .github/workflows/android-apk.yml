nname: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli --save-dev

      - name: Install Capacitor Android
        run: npm install @capacitor/android --save

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx --no-install cap sync android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: tools platform-tools

      - name: Accept ALL Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-33" \
                     "platforms;android-34" \
                     "build-tools;33.0.2" \
                     "build-tools;34.0.0"

      # 🔥 FIX DEFINITIVO CONTRA EL ERROR DE BOUNCYCASTLE
      - name: Disable Gradle JAR caching
        run: |
          echo "org.gradle.caching=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.java.installations.auto-detect=false" >> ~/.gradle/gradle.properties

      - name: Pre-download BouncyCastle
        run: |
          mkdir -p ~/.gradle/caches/modules-2/files-2.1/org.bouncycastle/bcprov-jdk18on/1.79
          curl -L -o ~/.gradle/caches/modules-2/files-2.1/org.bouncycastle/bcprov-jdk18on/1.79/bcprov.jar \
            https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/1.79/bcprov-jdk18on-1.79.jar

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Clean Gradle cache
        run: rm -rf ~/.gradle/caches ~/.gradle/daemon ~/.gradle/native ~/.gradle/wrapper

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --refresh-dependencies --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestionDeSistema-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

